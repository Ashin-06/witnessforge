[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "witnessforge"
version = "1.1.0"
description = "Dependency-aware forensic parser failure reduction and repair validation lab"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7", "coverage>=7.4"]

[project.scripts]
witnessforge = "witnessforge.cli:main"

[tool.setuptools.packages.find]
include = ["witnessforge*"]

[tool.setuptools.package-data]
witnessforge = ["static/*"]

[tool.coverage.run]
source = ["witnessforge"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B905"]  # zip(strict=) is style

[tool.ruff.lint.per-file-ignores]
"android-fixture/*.py" = ["E402"]  # scripts that put the checkout on sys.path first
