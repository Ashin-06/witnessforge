name: Python and installation checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and local integration tests
        run: python -m unittest discover -s tests -v
      - name: Install build frontend
        run: python -m pip install build
      - name: Build source distribution and wheel
        run: python -m build
      - name: Exercise installed wheel outside the checkout
        run: python scripts/check_install.py --dist dist
  quality:
    name: Lint, security and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: ruff check .
      - run: bandit -q -r witnessforge -ll
      - name: Audit the pinned tools (the lab itself has no runtime dependencies)
        run: pip-audit -r requirements-dev.lock --no-deps --disable-pip --progress-spinner off
      - run: coverage run -m unittest discover -s tests
      - if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
